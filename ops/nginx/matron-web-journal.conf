server {
    listen 127.0.0.1:8082;
    server_name _;
    client_max_body_size 60M;
    root /opt/matron/web-journal/current;
    index index.html;

    # --- loop #568 hardening (three blocks below). Regressed twice to a bare
    # config, breaking the pdf.js worker AND re-introducing stale-bundle caching;
    # loop #740 templated this conf into the repo (ops/nginx/matron-web-journal.conf)
    # and made scripts/deploy.sh re-install + reload it on every deploy, guarded by
    # scripts/check-nginx-conf.sh (which fails the deploy if any block is missing).
    # Edit the blocks HERE; do NOT hand-edit /etc/nginx/conf.d — a deploy overwrites it. ---

    # Response compression (journal sync perf, 2026-09-26). nginx's stock gzip_types
    # is text/html only, so the JS bundle, the CSS and every journal JSON body
    # (/journal/snapshot is ~1.5 MB for a long history) went out uncompressed:
    # measured 6x smaller for the snapshot, 3.7x for main.js. gzip_proxied any: the
    # requests arrive through the bridge.easelyte.ai / Tailscale Serve proxies.
    # WebSocket frames are unaffected (that is permessage-deflate, journal-side).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml application/manifest+json text/plain;

    # ES module workers (pdf.js worker): nginx mime.types has no `.mjs` mapping, so
    # these fall back to application/octet-stream and the browser refuses to
    # `import()` them ("Failed to fetch dynamically imported module"). Serve .mjs as
    # JS. Regex location => evaluated before the prefix `/assets/` and `/` blocks.
    # The pdf worker is copied under a STATIC name (assets/pdf.worker.min.mjs, no
    # content hash), so it must revalidate — a pdfjs-dist upgrade changes the bytes
    # at the same URL, and immutable caching would pin a stale worker. =404 (no SPA
    # fallback).
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Hashed, content-addressed static assets: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA static. index.html (served here directly and via SPA fallback) must
    # revalidate every load, or the browser heuristically caches it and keeps
    # loading a stale hashed bundle after each deploy.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy to matron-journal (HTTP + WebSocket)
    location /journal/ {
        proxy_pass http://127.0.0.1:9810/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
