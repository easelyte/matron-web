name: Release

# Pushing a tag vX.Y.Z builds the web app and publishes it as a GitHub
# release asset, matron-X.Y.Z.tar.gz (one top-level directory, matron-X.Y.Z/),
# with a .sha256 beside it. Deployments fetch the tarball instead of building
# or committing their own copy; Matron Desktop's fetch script downloads the
# same name from releases/download/vX.Y.Z/.
#
# The tarball carries no config.json (each deployment supplies its own) and no
# source maps (the source is public, and they are two thirds of the size). Its
# mtimes, owners and order are normalised, so a rebuild of the same commit on
# the same toolchain gives the same sha256.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

      - name: Check the tag matches package.json
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$package_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $package_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          rm -f config.json
          pnpm build
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Pack
        id: pack
        run: |
          name="matron-${{ steps.version.outputs.version }}"
          find webapp -name '*.map' -delete
          rm -f webapp/config.json
          mv webapp "$name"
          tar --sort=name --mtime="$(git show -s --format=%cI HEAD)" \
            --owner=0 --group=0 --numeric-owner --mode='u=rwX,go=rX' \
            -cf - "$name" | gzip -n -9 > "$name.tar.gz"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${prerelease[@]}" \
            --title "$GITHUB_REF_NAME" \
            "${{ steps.pack.outputs.name }}.tar.gz" \
            "${{ steps.pack.outputs.name }}.tar.gz.sha256"
        env:
          GH_TOKEN: ${{ github.token }}
