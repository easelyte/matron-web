<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Matron · light-mobile-list</title>
<meta name="matron-state" content="light-mobile-list">
<meta name="matron-state-note" content="Single column (380px), session list screen — sidebar only, no chat pane.">
<style>
/* Self-hosted so these files are screenshot-faithful offline, not just probe-faithful.
   Inter: rsms/inter docs/font-files/InterVariable.woff2 (OFL). Fira Code: google/fonts
   ofl/firacode/FiraCode[wght].ttf (OFL, licence alongside). Metrics unaffected either
   way — every size/weight/line-height in this design is authored absolutely. */
@font-face { font-family: Inter; font-weight: 100 900; font-style: normal; font-display: block; src: url("./fonts/InterVariable.woff2") format("woff2"); }
@font-face { font-family: "Fira Code"; font-weight: 300 700; font-style: normal; font-display: block; src: url("./fonts/FiraCode%5Bwght%5D.ttf") format("truetype"); }


:root {
  --m-app:#f4f2ee; --m-panel:#ffffff; --m-paper:#efece6; --m-raised:#faf8f4; --m-overlay:#ffffff;
  --m-ink:#1b1815; --m-ink2:#6b655c; --m-ink3:#9a938a;
  --m-line:#e7e2d9; --m-line2:#d8d1c5;
  --m-accent:#0d9488; --m-accent-deep:#0f766e; --m-on-accent:#ffffff;
  --m-self:#e6f4ef; --m-subtle:#f2efe9; --m-subtle2:#eae5dd;
  --m-hover:rgb(28 24 20 / 0.05); --m-active:rgb(28 24 20 / 0.09); --m-selected:rgb(13 148 136 / 0.10);
  --m-track:rgb(28 24 20 / 0.12);
  --m-green:#34c759; --m-amber:#ff9500; --m-red:#ff3b30; --m-crit:#bd2020;
  --m-diff-add:rgb(52 199 89 / 0.13); --m-diff-del:rgb(255 59 48 / 0.09);
  --m-sh-sm:0 1px 2px rgb(28 24 20 / 0.06); --m-sh-md:0 4px 12px rgb(28 24 20 / 0.10); --m-sh-lg:0 16px 48px rgb(28 24 20 / 0.16);
  --m-scrollbar:rgb(28 24 20 / 0.22); --m-scrollbar-hover:rgb(28 24 20 / 0.34); --m-selection:rgb(13 148 136 / 0.20);
}
[data-theme="dark"] {
  --m-app:#121316; --m-panel:#1a1c20; --m-paper:#151619; --m-raised:#212429; --m-overlay:#282c32;
  --m-ink:#e7e4df; --m-ink2:#9a948b; --m-ink3:#6d675f;
  --m-line:#2a2d33; --m-line2:#3a3f46;
  --m-accent:#2dd4bf; --m-accent-deep:#14b8a6; --m-on-accent:#0b201c;
  --m-self:#123530; --m-subtle:#212429; --m-subtle2:#282c32;
  --m-hover:rgb(255 255 255 / 0.06); --m-active:rgb(255 255 255 / 0.10); --m-selected:rgb(45 212 191 / 0.14);
  --m-track:rgb(255 255 255 / 0.12);
  --m-crit:#ff6a6a;
  --m-diff-add:rgb(52 199 89 / 0.12); --m-diff-del:rgb(255 107 107 / 0.10);
  --m-sh-sm:0 1px 2px rgb(0 0 0 / 0.3); --m-sh-md:0 4px 12px rgb(0 0 0 / 0.4); --m-sh-lg:0 16px 48px rgb(0 0 0 / 0.5);
  --m-scrollbar:rgb(255 255 255 / 0.20); --m-scrollbar-hover:rgb(255 255 255 / 0.32); --m-selection:rgb(45 212 191 / 0.26);
}
html, body { width:100%; height:100%; margin:0; overflow:hidden; }
body { background:var(--m-app); }
a { color:var(--m-accent); text-decoration:none; }
a:hover { text-decoration:underline; }
textarea::placeholder, input::placeholder { color:var(--m-ink3); }
/* Native chrome is part of the theme, not an exception to it. */
* { scrollbar-width:thin; scrollbar-color:var(--m-scrollbar) transparent; }
*::-webkit-scrollbar { width:10px; height:10px; }
*::-webkit-scrollbar-track { background:transparent; }
*::-webkit-scrollbar-thumb { background:var(--m-scrollbar); border:3px solid transparent; background-clip:content-box; border-radius:99px; }
*::-webkit-scrollbar-thumb:hover { background:var(--m-scrollbar-hover); border:3px solid transparent; background-clip:content-box; }
*::-webkit-scrollbar-corner { background:transparent; }
::selection { background:var(--m-selection); }
:focus-visible { outline:2px solid var(--m-accent); outline-offset:2px; }
@keyframes m-pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
@keyframes m-spin { to { transform:rotate(360deg); } }
@keyframes m-wave { 0%,100% { transform:scaleY(0.3); } 50% { transform:scaleY(1); } }

</style>
</head>
<body>
<div style="width:380px; height:100vh; overflow:hidden;">

<div data-screen-label="Matron redesign" style="display:flex; width:100%; height:100vh; overflow:hidden; background:var(--m-app); color:var(--m-ink); font:400 14px/1.55 Inter, 'Helvetica Neue', sans-serif;">

  
  <aside data-screen-label="Sidebar" data-spec="sidebar" style="display:flex; flex-direction:column; min-height:0; flex:0 0 auto; width:100%; min-width:0; background:var(--m-panel); border-right:1px solid var(--m-line);">
    <div style="display:flex; align-items:center; gap:10px; padding:14px 12px 10px 14px;">
      <img src="res/matron-logo-simple.svg" alt="Matron" style="width:22px; height:22px;">
      <span style="font:600 15px/20px Inter, sans-serif;">Matron</span>
      <span style="flex:1;"></span>
      <button title="Toggle theme" style="display:inline-flex; width:30px; height:30px; align-items:center; justify-content:center; border:0; border-radius:8px; background:transparent; color:var(--m-ink2); cursor:pointer;" data-style-hover="background:var(--m-hover); color:var(--m-ink);">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path></svg>
      </button>
      <button title="Settings" style="display:inline-flex; width:30px; height:30px; align-items:center; justify-content:center; border:0; border-radius:8px; background:transparent; color:var(--m-ink2); cursor:pointer;" data-style-hover="background:var(--m-hover); color:var(--m-ink);">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"></path><circle cx="15" cy="8" r="2"></circle><circle cx="9" cy="16" r="2"></circle></svg>
      </button>
    </div>
    <div style="padding:0 12px 10px;">
      <button data-spec="sidebar.newSession" title="Opens the new-session sheet (/start)" style="display:flex; width:100%; align-items:center; justify-content:center; gap:8px; height:34px; border:1px solid rgb(13 148 136 / 25%); border-radius:8px; background:var(--m-selected); color:var(--m-accent); font:500 13px/16px Inter, sans-serif; cursor:pointer;" data-style-hover="background:var(--m-active);">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h8"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"></path></svg>
        New session
      </button>
    </div>
    <div data-spec="sidebar.tabs" style="display:flex; gap:2px; margin:0 12px 8px; padding:2px; border-radius:999px; background:var(--m-subtle2);">
      <button data-spec="sidebar.tab.active" style="flex:1; border:0; border-radius:999px; padding:5px 8px; background:var(--m-panel); color:var(--m-ink); box-shadow:var(--m-sh-sm); font:500 12px/16px Inter, sans-serif; cursor:pointer;" data-style-hover="color:var(--m-ink);">Active</button>
      <button title="Favorites" style="flex:1; display:inline-flex; align-items:center; justify-content:center; gap:5px; border:0; border-radius:999px; padding:5px 8px; background:transparent; color:var(--m-ink2); box-shadow:none; font:500 12px/16px Inter, sans-serif; cursor:pointer;" data-style-hover="color:var(--m-ink);"><svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor" stroke="none"><path d="M12 4l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 16.9 7.2 19l.9-5.4L4.2 9.7l5.4-.8L12 4Z"></path></svg>Favs</button>
      <button style="flex:1; border:0; border-radius:999px; padding:5px 8px; background:transparent; color:var(--m-ink2); box-shadow:none; font:500 12px/16px Inter, sans-serif; cursor:pointer;" data-style-hover="color:var(--m-ink);">Archived <span style="color:var(--m-ink3);">4</span></button>
    </div>
    <div style="padding:0 12px 10px;">
      <div style="display:flex; align-items:center; gap:8px; height:32px; padding:0 10px; border-radius:8px; background:var(--m-subtle2); color:var(--m-ink2);">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <input type="search" placeholder="Search sessions" style="width:100%; min-width:0; border:0; outline:0; background:transparent; color:var(--m-ink); font:400 13px/16px Inter, sans-serif;">
      </div>
    </div>
    <nav data-spec="sidebar.list" style="flex:1; min-height:0; overflow-y:auto; padding:2px 8px 8px; display:flex; flex-direction:column; gap:1px;">
      
      <button data-spec="sidebar.row.selected" style="position:relative; display:flex; width:100%; align-items:center; gap:10px; padding:9px 10px; border:0; border-radius:8px; background:var(--m-selected); color:var(--m-ink); text-align:left; cursor:pointer;" data-style-hover="background:var(--m-hover);">
        <span style="position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:99px; background:var(--m-accent);"></span>
        <span data-spec="sidebar.row.status" title="running" style="width:8px; height:8px; flex:0 0 auto; border-radius:50%; background:var(--m-accent); animation:m-pulse 1.6s ease-in-out infinite;"></span>
        <span style="flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;">
          <span style="display:flex; align-items:baseline; gap:8px;"><span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:500 13px/17px Inter, sans-serif;">matron-web · deploy</span><span style="flex:0 0 auto; font:400 11px/14px Inter, sans-serif; color:var(--m-ink3);">10:06</span></span>
          <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:400 12px/16px Inter, sans-serif; color:var(--m-ink2);">Restarted nginx; error rate steady at 0.02%</span>
        </span>
      </button>
      <button data-spec="sidebar.row" style="position:relative; display:flex; width:100%; align-items:center; gap:10px; padding:9px 10px; border:0; border-radius:8px; background:transparent; color:var(--m-ink); text-align:left; cursor:pointer;" data-style-hover="background:var(--m-hover);">
        <span style="position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:99px; background:transparent;"></span>
        <span style="width:8px; display:inline-flex; justify-content:center; flex:0 0 auto; color:var(--m-ink3);"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 3 3H7l3-3-1-6Z"></path><path d="M12 16v4"></path></svg></span>
        <span style="flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;">
          <span style="display:flex; align-items:baseline; gap:8px;"><span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:600 13px/17px Inter, sans-serif;">infra: backup rotation</span><span style="flex:0 0 auto; font:400 11px/14px Inter, sans-serif; color:var(--m-ink3);">09:41</span></span>
          <span style="display:flex; align-items:center; gap:6px;"><span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:400 12px/16px Inter, sans-serif; color:var(--m-ink2);">Cron entry added for 03:15 UTC daily</span><span style="flex:0 0 auto; display:inline-flex; min-width:18px; height:18px; align-items:center; justify-content:center; padding:0 5px; border-radius:9px; background:var(--m-accent); color:var(--m-on-accent); font:600 10px/18px Inter, sans-serif;" data-spec="sidebar.row.unread">3</span></span>
        </span>
      </button>
      <button style="position:relative; display:flex; width:100%; align-items:center; gap:10px; padding:9px 10px; border:0; border-radius:8px; background:transparent; color:var(--m-ink); text-align:left; cursor:pointer;" data-style-hover="background:var(--m-hover);">
        <span style="position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:99px; background:transparent;"></span>
        <span style="width:8px; height:8px; flex:0 0 auto; border-radius:50%; background:var(--m-line2);"></span>
        <span style="flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;">
          <span style="display:flex; align-items:baseline; gap:8px;"><span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:600 13px/17px Inter, sans-serif;">postgres upgrade dry-run</span><span style="flex:0 0 auto; font:400 11px/14px Inter, sans-serif; color:var(--m-ink3);">Wed</span></span>
          <span style="display:flex; align-items:center; gap:6px;"><span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:400 12px/16px Inter, sans-serif; color:var(--m-ink2);">pg_upgrade finished · 0 errors</span><span style="flex:0 0 auto; width:8px; height:8px; border-radius:50%; background:var(--m-accent);"></span></span>
        </span>
      </button>
      
      
      <button style="position:relative; display:flex; width:100%; align-items:center; gap:10px; padding:9px 10px; border:0; border-radius:8px; background:transparent; color:var(--m-ink); text-align:left; cursor:pointer;" data-style-hover="background:var(--m-hover);">
        <span style="position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:99px; background:transparent;"></span>
        <span style="width:8px; display:inline-flex; justify-content:center; flex:0 0 auto; color:var(--m-amber);"><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" stroke="none"><path d="M12 4l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 16.9 7.2 19l.9-5.4L4.2 9.7l5.4-.8L12 4Z"></path></svg></span>
        <span style="flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;">
          <span style="display:flex; align-items:baseline; gap:8px;"><span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:500 13px/17px Inter, sans-serif;">codex: log parser</span><span style="flex:0 0 auto; font:400 11px/14px Inter, sans-serif; color:var(--m-ink3);">Tue</span></span>
          <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:400 12px/16px Inter, sans-serif; color:var(--m-ink2);">idle · resumed twice today</span>
        </span>
      </button>
      
      
      <button style="position:relative; display:flex; width:100%; align-items:center; gap:10px; padding:9px 10px 9px 26px; border:0; border-radius:8px; background:transparent; color:var(--m-ink); text-align:left; cursor:pointer;" data-style-hover="background:var(--m-hover);">
        <span style="position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:99px; background:transparent;"></span>
        <span style="width:12px; height:12px; flex:0 0 auto; box-sizing:border-box; border:2px solid rgb(13 148 136 / 25%); border-top-color:var(--m-accent); border-radius:50%; animation:m-spin 0.8s linear infinite;"></span>
        <span style="flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;">
          <span style="display:flex; align-items:baseline; gap:8px;"><span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:500 13px/17px Inter, sans-serif; color:var(--m-ink2);">↳ subagent: test triage</span><span style="flex:0 0 auto; font:400 11px/14px Inter, sans-serif; color:var(--m-ink3);">10:01</span></span>
          <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:400 12px/16px Inter, sans-serif; color:var(--m-ink2);">32 tests fixed, 1 quarantined</span>
        </span>
      </button>
      <button style="position:relative; display:flex; width:100%; align-items:center; gap:10px; padding:9px 10px; border:0; border-radius:8px; background:transparent; color:var(--m-ink); text-align:left; cursor:pointer;" data-style-hover="background:var(--m-hover);">
        <span style="position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:99px; background:transparent;"></span>
        <span style="width:8px; height:8px; flex:0 0 auto; border-radius:50%; background:var(--m-line2);"></span>
        <span style="flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;">
          <span style="display:flex; align-items:baseline; gap:8px;"><span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:500 13px/17px Inter, sans-serif;">homelab dns cutover</span><span style="flex:0 0 auto; font:400 11px/14px Inter, sans-serif; color:var(--m-ink3);">Mon</span></span>
          <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:400 12px/16px Inter, sans-serif; color:var(--m-ink2);">waiting on TTL expiry</span>
        </span>
      </button>
      
      
      
    </nav>
    <div style="display:flex; align-items:center; gap:10px; padding:10px 14px; border-top:1px solid var(--m-line);">
      <span style="display:inline-flex; width:26px; height:26px; align-items:center; justify-content:center; border-radius:50%; background:var(--m-selected); color:var(--m-accent); font:600 12px/16px Inter, sans-serif;">O</span>
      <span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:400 12px/16px Inter, sans-serif; color:var(--m-ink2);">operator@easelyte.ai</span>
      <span data-spec="sidebar.footer.connection" style="font:400 11px/14px Inter, sans-serif; color:var(--m-ink3);">connected</span>
      <button data-spec="devtool.stateMatrix" title="Handoff affordance — NOT a product feature. Opens the state matrix." style="border:1px dashed var(--m-line2); border-radius:6px; background:transparent; color:var(--m-ink3); font:500 10px/14px Inter, sans-serif; cursor:pointer; padding:1px 5px; flex:0 0 auto;" data-style-hover="background:var(--m-hover);">states</button>
    </div>
  </aside>
  

  

  

  

  
</div>
</div>
</body>
</html>
